# Production-shaped stack for a single VPS (e.g. OVHcloud). Put Caddy/nginx in front for TLS.
# Postgres uses the pgvector image so Phase 2 (memory) needs no infrastructure change.
# Redis is intentionally not part of the stack: the task queue, leases and memory all live in Postgres (see docs/ARCHITECTURE.md).
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: agent
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://agent:${POSTGRES_PASSWORD}@db:5432/agent
    ports: ["127.0.0.1:8080:8080"]   # bind to localhost; expose through your TLS reverse proxy
  # Optional extra mission workers:  docker compose --profile scale up -d --scale worker=3
  # The API already runs an embedded worker; extra workers are safe alongside it (SKIP LOCKED + lease fencing).
  worker:
    build: .
    profiles: ["scale"]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://agent:${POSTGRES_PASSWORD}@db:5432/agent
    command: ["node", "dist/worker-main.js"]
volumes:
  pgdata:
