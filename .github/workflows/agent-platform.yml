name: agent-platform
on:
  push:
    paths: ["agent-platform/**", ".github/workflows/agent-platform.yml"]
  pull_request:
    paths: ["agent-platform/**", ".github/workflows/agent-platform.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent-platform } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: agent-platform/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @ap/api test
      - run: pnpm build
      - run: pnpm --filter @ap/web test
      - run: docker build -t agent-platform .
      - run: docker build --build-arg BROWSER=chromium -t agent-platform-browser .
